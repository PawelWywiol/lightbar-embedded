; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = platformio/espressif32@^6.7.0
framework = espidf
platform_packages =
	platformio/tool-ninja@^1.13.2
monitor_speed = 115200
monitor_raw = true

[common]
lib_deps =
	https://github.com/joltwallet/esp_littlefs.git#v1.20.1

[esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = sdkconfig.esp32-c3-devkitm-1-partisions.csv
board_build.filesystem = littlefs
lib_deps =
	${common.lib_deps}

[env:esp32-c3-devkitm-1]
extends = esp32c3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release"

[env:esp32-c3-devkitm-1-debug]
extends = esp32c3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.debug"

[env:esp32-s3-devkitc-1]
extends = esp32c3
board = esp32-s3-devkitc-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release"

[env:gledopto-gl-c-016wl-d]
extends = esp32c3
board = esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release;sdkconfig.gledopto"
